<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>污水厂 A²/O 工艺模拟器 · 10 万 m³/d</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --teal:#0d9488; --blue:#2563eb; --amber:#d97706; --red:#dc2626; --green:#16a34a;
  --navy:#0b2b3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5;
}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer}
#errbar{display:none;background:#7f1d1d;color:#fff;padding:8px 16px;font-size:13px}

/* ---------- 顶栏 ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:14px 22px;background:linear-gradient(120deg,#0b2b3c 0%,#12455c 55%,#0f5b63 100%);
  color:#fff;box-shadow:0 2px 14px rgba(11,43,60,.25);
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(150deg,#22d3ee,#0d9488);color:#04222b;font-weight:800;font-size:16px;
  box-shadow:0 4px 14px rgba(34,211,238,.35);
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand p{font-size:12px;color:#9fc6d4;margin-top:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scen{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:10px}
.scen label{font-size:12px;color:#a9cbd8}
.scen select{
  background:rgba(255,255,255,.95);border:none;border-radius:7px;padding:6px 8px;font-size:13px;
  color:#0b2b3c;font-weight:600;max-width:250px;
}
.btn{
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#eaf6fa;
  padding:7px 12px;border-radius:9px;font-size:13px;transition:.15s;
}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:linear-gradient(180deg,#14b8a6,#0d9488);border-color:#0f766e;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted);width:100%;margin-top:12px}
.btn.ghost:hover{color:var(--ink);border-color:#cbd5e1}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:14px 22px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.kpi .kt{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.kpi .kv{display:flex;align-items:baseline;gap:4px;margin-top:3px}
.kpi .kv b{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi .kv span{font-size:10.5px;color:#94a3b8}
.kpi .kbar{height:3px;background:#eef2f7;border-radius:2px;margin-top:8px;overflow:hidden}
.kpi .kbar i{display:block;height:100%;width:3%;border-radius:2px;transition:width .25s}
.i-ok,.r-ok{background:linear-gradient(90deg,#34d399,#10b981)}
.r-warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.r-bad{background:linear-gradient(90deg,#f87171,#dc2626)}
#kpi-pass .kv b{font-size:17px}
#kpi-pass.ok{background:linear-gradient(140deg,#ecfdf5,#fff);border-color:#a7f3d0}
#kpi-pass.ok .kv b{color:#047857}
#kpi-pass.bad{background:linear-gradient(140deg,#fef2f2,#fff);border-color:#fecaca}
#kpi-pass.bad .kv b{color:#b91c1c}

/* ---------- 提示条 ---------- */
.alerts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 22px 0}
.alert{font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid}
.alert.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.alert.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.alert.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}

/* ---------- 主区 ---------- */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:14px;padding:12px 22px 40px;align-items:start}
.colmain{min-width:0;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:14px;font-weight:700}
.card-head .hint{font-size:11.5px;color:#94a3b8}
.diagram-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.diagram{padding:6px 8px 0;background:
  radial-gradient(circle at 20% 0%,rgba(13,148,136,.05),transparent 45%),
  radial-gradient(circle at 85% 100%,rgba(37,99,235,.05),transparent 45%),#fbfdff;}
.diagram svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 16px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* ---------- SVG ---------- */
.pipe{fill:none;stroke:#dde6ef;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.5 13;animation:flow 1.5s linear infinite}
.flow.w{stroke:#3fb6ee}
.flow.s{stroke:#f59e0b;animation-duration:3.2s}
.flow.r{stroke:#fbbf24;animation-duration:2.4s}
.flow.c{stroke:#a78bfa;animation-duration:2.6s}
@keyframes flow{to{stroke-dashoffset:-13.5}}
.plabel{fill:#94a3b8;font-size:11px;font-family:inherit}
.node{cursor:pointer}
.node .card{fill:#fff;stroke:#dbe3ec;stroke-width:1;filter:drop-shadow(0 1px 2px rgba(15,23,42,.06));transition:.15s}
.node:hover .card{stroke:#5eead4;filter:drop-shadow(0 4px 10px rgba(13,148,136,.18))}
.node.sel .card{stroke:#0d9488;stroke-width:2.2;filter:drop-shadow(0 4px 12px rgba(13,148,136,.25))}
.node .bar{opacity:.9}
.node .nt{fill:#0f172a;font-size:13px;font-weight:700;text-anchor:middle;font-family:inherit}
.node .nl{fill:#64748b;font-size:11.5px;text-anchor:middle;font-family:inherit}
.node.pill .card{fill:#0b2b3c;stroke:#0b2b3c}
.node.pill .nt{fill:#fff;font-size:12px}
.node.pill .nl{fill:#8fd3e8;font-size:10.5px}
.node.pill.sel .card{stroke:#22d3ee;stroke-width:2.5}
.node .st{stroke:#fff;stroke-width:1.6}
.node .st.ok{fill:#22c55e}
.node .st.warn{fill:#f59e0b}
.node .st.bad{fill:#ef4444}
.dose rect{fill:#f5f3ff;stroke:#ddd6fe;stroke-width:1;stroke-dasharray:4 3}
.dose text{fill:#7c3aed;font-size:10.5px;text-anchor:middle;font-family:inherit}

/* ---------- 参数面板 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-height:min(880px,calc(100vh - 110px));overflow:auto;position:sticky;top:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:#dbe3ec;border-radius:4px}
.ph{border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.pcat{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 25%,#fff);font-weight:600}
.ph h2{font-size:17px;margin-top:8px;font-weight:700}
.ph p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.reads{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
.rt{font-size:11px;color:#94a3b8;margin-bottom:8px;letter-spacing:.5px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.rcell{min-width:0}
.rk{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv span{font-size:10px;font-weight:400;color:#94a3b8;margin-left:3px}
.pgroup{margin-bottom:14px}
.pgt{font-size:11px;color:#94a3b8;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.prow{margin-bottom:13px}
.ptop{display:flex;align-items:baseline;gap:6px}
.plabel{font-size:12.5px;color:#334155;flex:1}
.pval{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal)}
.punit{font-size:10.5px;color:#94a3b8;min-width:44px;text-align:right}
.prange{width:100%;margin:6px 0 0;accent-color:#0d9488;height:4px}
.phint{font-size:10.5px;color:#94a3b8;margin-top:3px;line-height:1.5}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;margin-top:6px;color:var(--muted)}
.pbtn.on{background:#ecfdf5;border-color:#a7f3d0;color:#047857;font-weight:600}

/* ---------- 设备卡片 ---------- */
.eqsec{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.eqcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:#fbfdff}
.eqh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eqn{font-size:12.5px;font-weight:600;color:#1e293b}
.eqc{font-size:10.5px;color:var(--muted);background:#eef2f7;padding:1px 8px;border-radius:20px;white-space:nowrap}
.eqline{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px}
.eqline b{color:#334155;font-weight:600;font-variant-numeric:tabular-nums}
.eqbar{height:4px;background:#eef2f7;border-radius:3px;margin:5px 0 3px;overflow:hidden}
.eqbar i{display:block;height:100%;border-radius:3px;background:#10b981;transition:width .2s}
.eqbar i.r-warn{background:#f59e0b}
.eqbar i.r-bad{background:#ef4444}
.eqfoot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.eqfields{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px}
.eqf{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
.eqf input{width:58px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;font-size:11px;text-align:right;font-family:inherit;color:var(--ink)}
.eqf input:focus{outline:none;border-color:#5eead4}
.eqf i{font-style:normal;color:#94a3b8;min-width:24px}

/* ---------- 设备模型 ---------- */
.eqsvg{width:100%;height:auto;display:block}
.eqsvg text{font-family:inherit}
.spin{animation:eqspin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.spin.fast{animation-duration:.9s}
.spin.slow{animation-duration:5s}
.spin.vslow{animation-duration:16s}
.spin.rev{animation-direction:reverse}
@keyframes eqspin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 8;animation:eqdash 1.1s linear infinite}
@keyframes eqdash{to{stroke-dashoffset:-14}}
.still *{animation:none !important}
.rake{animation:eqrake 3.4s ease-in-out infinite alternate}
@keyframes eqrake{to{transform:translateY(-26px)}}
.pist{animation:eqpist 1.4s ease-in-out infinite alternate}
@keyframes eqpist{to{transform:translateX(12px)}}
.bub{animation:eqbub 2.6s ease-in infinite}
@keyframes eqbub{0%{transform:translateY(0);opacity:.15}25%{opacity:.95}100%{transform:translateY(-64px);opacity:0}}
.drop{animation:eqdrop 1.7s ease-in infinite}
@keyframes eqdrop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(20px);opacity:0}}
.drift{animation:eqdrift 6s linear infinite}
@keyframes eqdrift{to{transform:translateX(20px)}}
.auger{stroke-dasharray:9 7;animation:eqaug 1.1s linear infinite}
.auger2{stroke-dasharray:9 7;animation:eqaug 1.1s linear infinite}
@keyframes eqaug{to{stroke-dashoffset:-16}}
.eqlook{display:block;text-align:right;font-size:10.5px;color:#0d9488;margin-top:7px;cursor:pointer;font-weight:600}
.eqlook:hover{text-decoration:underline}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acard{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:.16s}
.acard:hover{border-color:#5eead4;box-shadow:0 8px 20px rgba(13,148,136,.13);transform:translateY(-2px)}
.acard .thumb{background:linear-gradient(160deg,#fbfdff,#eef6fb);padding:4px 6px}
.acard .meta{padding:8px 11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
.acard .an{font-size:12.5px;font-weight:600}
.acard .au{font-size:10.5px;color:#94a3b8}
.acard .ld{font-size:10.5px;padding:1px 7px;border-radius:20px;background:#ecfdf5;color:#047857;white-space:nowrap}
.acard .ld.w{background:#fffbeb;color:#92400e}
.acard .ld.b{background:#fef2f2;color:#b91c1c}
.mask{position:fixed;inset:0;background:rgba(8,27,40,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;width:min(1100px,100%);max-height:92vh;overflow:auto;box-shadow:0 26px 70px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{font-size:19px}
.modal-head p{font-size:12px;color:var(--muted);margin-top:3px}
.modal-head .x{border:none;background:#f1f5f9;width:30px;height:30px;border-radius:8px;font-size:17px;color:#64748b;line-height:1}
.modal-head .x:hover{background:#e2e8f0;color:#0f172a}
.modal-in{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:24px;padding:18px 22px 24px}
.mleft{background:linear-gradient(160deg,#fbfdff,#eef6fb);border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;align-self:start;position:sticky;top:70px}
.mright h4{font-size:12px;color:#0f766e;margin:14px 0 5px;letter-spacing:.5px}
.mright h4:first-child{margin-top:0}
.mright p{font-size:12.5px;line-height:1.85;color:#334155}
.mstats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:82px}
.chip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.chip span{font-size:10px;color:#94a3b8}
.parts{margin:4px 0;padding-left:0;list-style:none;columns:2;column-gap:18px}
.parts li{font-size:11.5px;color:#334155;line-height:1.9;break-inside:avoid}
.parts li b{color:#0f766e;margin-right:5px}
.faults{margin:4px 0;padding-left:18px}
.faults li{font-size:11.5px;color:#334155;line-height:1.85}
@media (max-width:900px){.modal-in{grid-template-columns:1fr}.mleft{position:static}.parts{columns:1}}

/* ---------- 页签 ---------- */
.bottom{padding:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 15px;border-radius:9px;font-size:13px}
.tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tabbody{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:220px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.mt{margin-top:16px}
.ct{font-size:12.5px;font-weight:700;color:#334155;margin-bottom:8px}
.ct b.big{font-size:20px;color:var(--teal)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafc}
.tbl td{padding:6px 4px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.tbl tr:hover td{background:#f8fafc}
.tbl td.name{font-weight:600;color:#1e293b}
.tbl .rowout td{background:#f0fdfa;font-weight:700;color:#0f766e}
.tbl.compact td,.tbl.compact th{padding:6px 5px}
.tbl-wrap{overflow-x:auto}
.muted{color:#94a3b8;font-size:11.5px;white-space:normal}
.big{font-size:15px}
.tg-ok{color:#047857;font-weight:600}
.tg-bad{color:#b91c1c;font-weight:600}
.note-line{font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.6}
.barcell{display:flex;align-items:center;gap:8px;min-width:110px}
.minibar{flex:1;height:5px;background:#eef2f7;border-radius:3px;overflow:hidden;min-width:50px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#0e7490);border-radius:3px}
.chartbox{min-width:0;max-width:760px;margin-top:14px}
.chart{width:100%;height:auto}
.clegend{display:flex;gap:14px;font-size:11.5px;color:#64748b;margin:0 0 6px 38px}
.clegend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.cgrid{stroke:#eef2f7;stroke-width:1}
.clab{fill:#94a3b8;font-size:10px;font-family:inherit}
.cxlab{fill:#94a3b8;font-size:10px;font-family:inherit}

/* ---------- 达标卡 ---------- */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cmp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.cmp.ok{border-color:#bbf7d0;background:linear-gradient(160deg,#f0fdf4,#fff)}
.cmp.warn{border-color:#fde68a;background:linear-gradient(160deg,#fffbeb,#fff)}
.cmp.bad{border-color:#fecaca;background:linear-gradient(160deg,#fef2f2,#fff)}
.cmp-h{display:flex;justify-content:space-between;align-items:baseline}
.cmp-n{font-size:12.5px;color:var(--muted);font-weight:600}
.cmp-v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.cmp-v i{font-size:10px;font-style:normal;color:#94a3b8;font-weight:400}
.cmp-bar{position:relative;height:7px;background:#eef2f7;border-radius:4px;margin:9px 0 7px;overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:4px;background:#10b981;transition:width .25s}
.cmp.warn .cmp-bar i{background:#f59e0b}
.cmp.bad .cmp-bar i{background:#ef4444}
.cmp-bar b{position:absolute;top:0;bottom:0;width:2px;background:#0f172a;opacity:.5}
.cmp-f{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.diag{display:flex;flex-direction:column;gap:7px}
.dg{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;padding:8px 10px;border-radius:9px}
.dg i{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.dg.ok{background:#ecfdf5;color:#047857}.dg.ok i{background:#10b981}
.dg.warn{background:#fffbeb;color:#92400e}.dg.warn i{background:#f59e0b}
.dg.bad{background:#fef2f2;color:#b91c1c}.dg.bad i{background:#ef4444}

/* ---------- 成本 ---------- */
.price-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.pe{display:flex;align-items:center;gap:6px;font-size:12px;color:#334155}
.pe span{flex:1}
.pe input{width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;font-size:12px;text-align:right;font-family:inherit}
.pe i{font-style:normal;font-size:10.5px;color:#94a3b8;width:46px}

/* ---------- 说明 ---------- */
.notes h3{font-size:13.5px;margin:18px 0 6px;color:#0f766e}
.notes h3:first-child{margin-top:0}
.notes p,.notes li{font-size:12.5px;color:#334155;line-height:1.85}
.notes ul{margin:6px 0;padding-left:20px}
.notes b{color:#0f172a}

/* ---------- 打印报告 ---------- */
#report{display:none}
.rp-head{border-bottom:2px solid #0f172a;padding-bottom:10px;margin-bottom:16px}
.rp-head h1{font-size:20px}
.rp-sub{font-size:11px;color:#64748b;margin-top:4px}
#report h2{font-size:14px;margin:18px 0 8px;color:#0f766e}

<body>
<div id="errbar"></div>

  <div class="alerts" id="alerts"></div>

  <main class="workspace">

    </section>

      <button data-tab="cost">运行成本</button>
      <button data-tab="models">设备模型</button>
      <button data-tab="notes">模型说明</button>
    </nav>
    <div class="tabbody" id="tabbody"></div>
    </section>

    <aside class="panel" id="panel"></aside>
  </main>
</div>

<div id="report"></div>

        id: 'dpm', name: 'PAM 加药泵', unit: 'L/h', nk: 'eq_dpm_n', pk: 'eq_dpm_p',
        fields: ['eq_dpm_q', 'eq_dpm_p', 'eq_dpm_n'],
        params: [['eq_dpm_q', '单泵流量', 'L/h', 100, 3000, 50, 1500], ['eq_dpm_p', '电机功率', 'kW', 0.37, 3, 0.01, 1.5], ['eq_dpm_n', '工作台数', '台', 1, 4, 1, 1]],
        dem: function (R, P) { return R.sludge.pam / 0.002 / 24; },
        cap: function (P) { return P.eq_dpm_q * P.eq_dpm_n; },
        kw: function (R, P) { return P.eq_dpm_p * P.eq_dpm_n * 0.5; }
      }
    ]
  };

  // 把设备参数并入对应单元，供面板统一渲染与默认值收集
  Object.keys(EQ_SPEC).forEach(function (uid) {
    var unit = UNITS.filter(function (u) { return u.id === uid; })[0];
    if (!unit) return;
    EQ_SPEC[uid].forEach(function (t) {
      t.params.forEach(function (pp) {
        unit.params.push({
          k: pp[0], g: '设备', label: pp[1], unit: pp[2], min: pp[3], max: pp[4],
          step: pp[5], def: pp[6], dec: pp[5] < 1 ? 2 : 0, eq: true, hint: ''
        });
      });
    });
  });

  const DEFAULTS = {};
  UNITS.forEach(function (u) { u.params.forEach(function (p) { DEFAULTS[p.k] = p.def; }); });

  const LIMITS = {
    A: { COD: 50, BOD: 10, SS: 10, NH: 5, TN: 15, TP: 0.5, FC: 1000 },
    B: { COD: 60, BOD: 20, SS: 20, NH: 8, TN: 20, TP: 1.0, FC: 10000 }
  };

  /* ---------------------------------------------------------------- 工具函数 */
  // 按比例去除：SS/COD/BOD/TP 按比例，TN 只去除有机氮部分
  function remove(s, f) {
    const o = {};
    for (const k in s) o[k] = s[k];
    const on = Math.max(0, s.TN - s.NH);
    o.COD = s.COD * (1 - (f.COD || 0));
    o.BOD = s.BOD * (1 - (f.BOD || 0));
    o.SS = s.SS * (1 - (f.SS || 0));
    o.TP = s.TP * (1 - (f.TP || 0));
    o.NH = s.NH * (1 - (f.NH || 0));
    o.TN = s.TN - on * (f.TN || 0) - s.NH * (f.NH || 0);
    if (o.TN < o.NH) o.TN = o.NH;
    return o;
  }

  /* ---------------------------------------------------------------- 主计算 */
  function simulate(P) {
    const R = { u: {}, warn: [], streams: [], energy: [] };
    const Q = P.Q, Qd = P.Qd, T = P.iT, ind = P.iIND / 100;
    const addE = (name, kw, hours) => {
      const h = hours === undefined ? 24 : hours;
      R.energy.push({ name: name, kw: Math.max(0, kw), kwh: Math.max(0, kw) * h });
    };

    /* ---- 进水 ---- */
    const inf = { Q: Q, COD: P.iCOD, BOD: P.iBOD, SS: P.iSS, NH: P.iNH, TN: P.iTN, TP: P.iTP, ALK: P.iALK };
    const bc = inf.BOD / Math.max(1, inf.COD);
    R.u.influent = {
      Q: Q, Qd: Qd, loadRatio: Q / Qd, peakQ: Q * P.Kz, bc: bc,
      loadCOD: inf.COD * Q / 1000, loadTN: inf.TN * Q / 1000, loadTP: inf.TP * Q / 1000
    };
    R.streams.push({ id: 'influent', name: '进水', Q: Q, COD: inf.COD, BOD: inf.BOD, SS: inf.SS, NH: inf.NH, TN: inf.TN, TP: inf.TP, ALK: inf.ALK, hrt: 0, note: '管网来水' });

    /* ---- 粗格栅 ---- */
    let s = inf;
    {
      const rs = clamp(P.cs_ss / 100 * Math.pow(20 / P.cs_gap, 0.3), 0.005, 0.2);
      s = remove(s, { SS: rs, COD: 0.6 * rs, BOD: 0.6 * rs, TP: 0.3 * rs, TN: 0.25 });
      R.u.coarse = { rs: rs, gap: P.cs_gap, loss: P.cs_loss, screenings: Q * 0.00003, v: P.cs_v };
      R.streams.push({ id: 'coarse', name: '粗格栅', Q: Q, COD: s.COD, BOD: s.BOD, SS: s.SS, NH: s.NH, TN: s.TN, TP: s.TP, ALK: s.ALK, hrt: 0.02, note: '栅距 ' + P.cs_gap + ' mm' });
    }

    /* ---- 提升泵房 ---- */
    {
      const flow = Q / 86400; // m³/s
      const kw = 9.81 * flow * P.pp_H / (P.pp_eta * P.pp_etam);
      addE('进水泵房', kw);
      R.u.pump = { kw: kw, kwh: kw * 24, head: P.pp_H, perM3: kw * 24 / Q, n: P.pp_n, single: Q / P.pp_n };
      R.streams.push({ id: 'pump', name: '提升泵房', Q: Q, COD: s.COD, BOD: s.BOD, SS: s.SS, NH: s.NH, TN: s.TN, TP: s.TP, ALK: s.ALK, hrt: 0.1, note: '提升 ' + P.pp_H + ' m' });
    }

    /* ---- 细格栅 ---- */
    {
      const rs = clamp(P.fs_ss / 100 * Math.pow(6 / P.fs_gap, 0.3), 0.005, 0.25);
      s = remove(s, { SS: rs, COD: 0.6 * rs, BOD: 0.6 * rs, TP: 0.3 * rs, TN: 0.3 });
      R.u.fine = { rs: rs, gap: P.fs_gap, loss: P.fs_loss, screenings: Q * 0.00006, v: P.fs_v };
      R.streams.push({ id: 'fine', name: '细格栅', Q: Q, COD: s.COD, BOD: s.BOD, SS: s.SS, NH: s.NH, TN: s.TN, TP: s.TP, ALK: s.ALK, hrt: 0.02, note: '栅距 ' + P.fs_gap + ' mm' });
    }

    /* ---- 曝气沉砂池 ---- */
    {
      const V = Qd * P.gc_hrt / 1440;
      const hrtAct = V / Q * 1440;
      const rs = clamp(P.gc_ss / 100 * Math.pow(hrtAct / 3, 0.25), 0.01, 0.3);
      s = remove(s, { SS: rs, COD: P.gc_cod / 100, BOD: P.gc_cod / 100, TP: 0.15 * rs, TN: 0.15 });
      const air = P.gc_air * Q;
      const kw = air / 86400 * 4000 / 0.6 / 1000 + 3.0;
      addE('曝气沉砂池', kw);
      R.u.grit = { rs: rs, V: V, air: air, kw: kw, grit: Q * 0.000025, hrt: hrtAct };
      R.streams.push({ id: 'grit', name: '曝气沉砂池', Q: Q, COD: s.COD, BOD: s.BOD, SS: s.SS, NH: s.NH, TN: s.TN, TP: s.TP, ALK: s.ALK, hrt: P.gc_hrt / 60, note: 'HRT ' + P.gc_hrt + ' min' });
    }

    /* ---- 初沉池 ---- */
    let primarySludge = 0, dsPrimary = 0;
    {
      const ssIn = s.SS;
      const on = P.pc_bypass ? 0 : 1;
      const area = Qd / (P.pc_q * 24);
      const qAct = Q / (area * 24);
      const rsSS = on * clamp(P.pc_ss / 100 * Math.pow(1.5 / qAct, 0.35), 0.1, 0.85);
      const rsCOD = on * 0.48 * rsSS;
      const rsBOD = on * 0.55 * rsSS;
      s = remove(s, { SS: rsSS, COD: rsCOD, BOD: rsBOD, TP: on * 0.12, TN: on * 0.35 });
      const V = Qd * P.pc_hrt / 24;
      dsPrimary = rsSS * ssIn * Q / 1000;
      primarySludge = dsPrimary / ((1 - P.pc_moist / 100) * 1000);
      R.u.primary = { rsSS: rsSS, rsCOD: rsCOD, rsBOD: rsBOD, area: area, V: V, q: qAct, qd: P.pc_q, bypass: !!P.pc_bypass, ds: dsPrimary, vol: primarySludge, ssIn: ssIn };
      R.streams.push({ id: 'primary', name: P.pc_bypass ? '初沉池（超越）' : '初沉池', Q: Q, COD: s.COD, BOD: s.BOD, SS: s.SS, NH: s.NH, TN: s.TN, TP: s.TP, ALK: s.ALK, hrt: P.pc_bypass ? 0 : P.pc_hrt, note: P.pc_bypass ? '超越运行' : ('q=' + qAct.toFixed(2) + ' m³/(m²·h)') });
    }

    /* ---- 生化池 ---- */
    const B = {};
    {
      // 滤液回流带来的额外负荷（上清液 NH 150 / COD 250 / TP 20 / SS 400）
      const fr = P.sl_recycle / 100;
      const codIn = s.COD + 250 * fr;
      const bodIn = s.BOD;
      const ssIn = s.SS + 400 * fr;
      const nhIn = s.NH + 150 * fr;
      const tnIn = s.TN + 160 * fr;
      const tpIn = s.TP + 20 * fr;
      const alkIn = s.ALK;

      const Va = Qd * P.an_hrt / 24, Vx = Qd * P.ax_hrt / 24, Vo = Qd * P.ae_hrt / 24;
      const Vb = Va + Vx + Vo;
      const srt = P.ae_srt, doA = P.ae_do;

      // 出水有机物
      const inert = 0.06 + 0.22 * ind;
      const codOut = 14 + inert * codIn;
      const bodOut = 3.0 + 0.014 * bodIn;
      const dCOD = (codIn - codOut) * Q / 1000;         // kg/d

      // 污泥产量与 MLSS
      const Yobs = 0.60 / (1 + 0.05 * srt);
      const PxAct = Yobs * dCOD;
      const PxInert = 0.25 * ssIn * Q / 1000;
      const Px = PxAct + PxInert;                        // kgDS/d
      const mlss = clamp(srt * Px / Vb, 1.2, 8.0);       // kg/m³

      // 硝化
      const nitInhib = 1 - 0.30 * ind;
      const muA = 0.75 * Math.pow(1.072, T - 20) * (doA / (doA + 0.5)) * (nhIn / (nhIn + 1)) * nitInhib;
      const srtMin = 1 / Math.max(0.06, muA - 0.05);
      const ratio = srt / srtMin;
      let fNit = Math.pow(ratio, 3) / (1 + Math.pow(ratio, 3));

      const nAssim = 0.045 * Px * 1000 / Q;              // mg/L 同化
      const onEff = 1.2 + 0.04 * (tnIn - nhIn);          // 出水有机氮
      const tknNit = Math.max(0, tnIn - nAssim - onEff); // 可硝化氨氮
      let nNit = tknNit * fNit;

      // 反硝化
      const Rr = P.cl_R / 100, rr = P.ax_r / 100;
      const fdn = P.ax_fdn / 100;
      const codAvail = fdn * codIn * Q / 1000;
      const codAdd = P.ax_carbon * 0.78 * Q / 1000;
      const capC = (codAvail + codAdd) / 4.5;            // kgN/d 碳源限制
      const capK = P.ax_sdnr * Math.pow(1.06, T - 20) * (mlss * 0.7) * Vx; // kgN/d 动力学限制
      const cap = Math.min(capC, capK);
      const floor = nNit / (1 + Rr + rr);
      let no3 = Math.max(floor, nNit - cap * 1000 / Q);

      // 碱度校核
      let alkLeft = alkIn - 7.14 * nNit + 3.57 * (nNit - no3);
      if (alkLeft < 40 && fNit > 0.05) {
        const allow = Math.max(0, (alkIn + 40) / 7.14 + 0.5 * (nNit - no3));
        const fMax = clamp(allow / Math.max(0.01, tknNit), 0, 1);
        if (fMax < fNit) {
          fNit = fMax;
          nNit = tknNit * fNit;
          no3 = Math.max(nNit / (1 + Rr + rr), nNit - cap * 1000 / Q);
          alkLeft = alkIn - 7.14 * nNit + 3.57 * (nNit - no3);
        }
      }
      const nhOut = Math.max(0.3, (tknNit - nNit) + 0.6);
      const tnOut = nhOut + onEff + no3;
      const nDenit = (nNit - no3) * Q / 1000;
      const nNitLoad = nNit * Q / 1000;

      // 生物除磷
      const pRel = P.an_prel * tpIn * Math.sqrt(P.an_hrt / 1.5) / (1 + 2.0 * P.an_do);
      const no3Ana = no3 * Rr / (1 + Rr);
      const pEta = 1 / (1 + 0.10 * no3Ana);
      const pRem = Math.min(tpIn * 0.85, 2.6 * pRel * pEta);
      const tpOut = Math.max(0.15, tpIn - pRem);
      const tpHyd = tpIn + pRel;

      // 需氧量
      const aor = 0.50 * dCOD + 4.57 * nNitLoad - 2.86 * nDenit;
      const cs20 = 9.17;
      const csm = cs20 * (1 + P.ae_depth / 20.6 * 0.5);
      const fld = clamp(P.ae_alpha * (P.ae_beta * csm - doA) / cs20 * Math.pow(1.024, T - 20), 0.15, 1.2);
      const sor = aor / fld;
      const air = sor / (0.3 * P.ae_ea / 100);            // m³/d
      const dp = 9.81 * (P.ae_depth + 1.2) * 1000;        // Pa
      const kwAer = air / 86400 * dp / P.ae_betabl / 1000;
      addE('生化鼓风机', kwAer);

      // 回流与搅拌能耗
      const flowIn = Q / 86400;
      const kwR = 9.81 * flowIn * Rr * 6.0 / 0.78;
      const kwr = 9.81 * flowIn * rr * 2.5 / 0.78;
      addE('污泥回流泵', kwR);
      addE('混合液内回流泵', kwr);
      const kwMix = (Va + Vx) * Math.max(P.an_mix, 2) / 1000 * 1.15;
      addE('厌氧/缺氧搅拌器', kwMix);

      const qw = Px / 8; // 剩余污泥体积 m³/d（按 8 g/L）
      const kwW = 9.81 * (qw / 86400) * 12 / 0.7;
      addE('剩余污泥泵', kwW);

      B.codIn = codIn; B.bodIn = bodIn; B.ssIn = ssIn; B.nhIn = nhIn; B.tnIn = tnIn; B.tpIn = tpIn;
      B.Vb = Vb; B.Va = Va; B.Vx = Vx; B.Vo = Vo; B.hrtAct = Vb / Q;
      B.codOut = codOut; B.bodOut = bodOut; B.tpOut = tpOut; B.nhOut = nhOut; B.tnOut = tnOut;
      B.no3 = no3; B.mlss = mlss; B.Px = Px; B.fNit = fNit; B.srtMin = srtMin; B.muA = muA;
      B.nNit = nNit; B.nDenit = nDenit; B.alkLeft = alkLeft; B.aor = aor; B.sor = sor; B.air = air;
      B.kwAer = kwAer; B.pRel = pRel; B.no3Ana = no3Ana; B.pRem = pRem; B.tpHyd = tpHyd;
      B.capC = capC; B.capK = capK; B.cap = cap; B.limited = capC < capK ? '碳源不足' : '动力学受限';
      B.dCOD = dCOD; B.qw = qw;

      R.u.anaerobic = {
        V: Va, hrt: P.an_hrt, do: P.an_do, pRel: pRel, no3Ana: no3Ana,
        tpIn: tpIn, tpHyd: tpHyd, pEta: pEta
      };
      R.u.anoxic = {
        V: Vx, hrt: P.ax_hrt, r: P.ax_r, capC: capC, capK: capK, cap: cap, limited: B.limited,
        no3In: nNit * (Rr + rr) / (1 + Rr + rr), removed: nDenit, no3Out: no3,
        do: P.ax_do, carbon: P.ax_carbon
      };
      R.u.aerobic = {
        V: Vo, hrt: P.ae_hrt, srt: srt, mlss: mlss, muA: muA, srtMin: srtMin, fNit: fNit,
        nNitLoad: nNitLoad, nhOut: nhOut, alkLeft: alkLeft, aor: aor, sor: sor, air: air,
        kw: kwAer, kwh: kwAer * 24, do: doA
      };

      // 生化出水（混合液）→ 二沉池
      R.streams.push({
        id: 'bio', name: 'A²/O 生化池', Q: Q, COD: codOut, BOD: bodOut, SS: mlss * 1000,
        NH: nhOut, TN: tnOut, TP: tpOut, ALK: alkLeft, hrt: P.an_hrt + P.ax_hrt + P.ae_hrt,
        note: 'MLSS ' + Math.round(mlss * 1000) + ' mg/L'
      });
    }

    /* ---- 二沉池 ---- */
    let ssC, codC, bodC, nhC, tnC, tpC;
    {
      const Rr = P.cl_R / 100;
      const area = Qd / (P.cl_q * 24);
      const qAct = Q / (area * 24);
      const slr = (Q * (1 + Rr)) * B.mlss / area;
      ssC = clamp(4 + 9 * Math.pow(qAct / 0.9, 3) + Math.max(0, slr - P.cl_slr) / P.cl_slr * 10, 3, 120);
      codC = B.codOut * 0.97;
      bodC = B.bodOut * 0.95;
      nhC = B.nhOut; tnC = B.tnOut; tpC = B.tpOut;
      const xr = B.mlss * (1 + Rr) / Rr;
      addE('二沉池刮泥机', Q / 25000 * 1.1);
      R.u.clarifier = {
        area: area, q: qAct, qd: P.cl_q, slr: slr, slrMax: P.cl_slr, R: P.cl_R, xr: xr, ssOut: ssC,
        v: Q * P.cl_R / 100
      };
      R.streams.push({ id: 'clarifier', name: '二沉池', Q: Q, COD: codC, BOD: bodC, SS: ssC, NH: nhC, TN: tnC, TP: tpC, ALK: B.alkLeft, hrt: 3, note: 'q=' + qAct.toFixed(2) + ' m³/(m²·h)' });
    }

    /* ---- 高效沉淀池 ---- */
    let ssT, codT, bodT, tpT, nhT, tnT, dsChem = 0;
    {
      const area = Qd / (P.tp_q * 24);
      tpT = Math.max(0.06, tpC * 0.32 - 0.0075 * P.tp_pac);
      ssT = Math.max(2.5, 4 + 0.15 * (ssC - 10) + Math.max(0, 10 - P.tp_pac) * 0.12);
      ssT = Math.min(ssT, ssC);
      codT = codC * 0.88;
      bodT = bodC * 0.85;
      nhT = nhC; tnT = tnC;
      dsChem = P.tp_pac * 0.35 * Q / 1000 + Math.max(0, (ssC - ssT)) * Q / 1000;
      addE('高效沉淀池', 12);
      R.u.tertiary = { area: area, q: Q / (area * 24), pac: P.tp_pac, pam: P.tp_pam, tpOut: tpT, ssOut: ssT, ds: dsChem, tpRem: 1 - tpT / Math.max(0.01, tpC) };
      R.streams.push({ id: 'tertiary', name: '高效沉淀池', Q: Q, COD: codT, BOD: bodT, SS: ssT, NH: nhT, TN: tnT, TP: tpT, ALK: B.alkLeft, hrt: 0.9, note: 'PAC ' + P.tp_pac + ' mg/L' });
    }

    /* ---- 反硝化滤池 ---- */
    let ssD, no3D, tnD, tpD, codD;
    {
      const area = Qd / (P.df_rate * 24);
      const capF = P.df_naac * 0.78 / 4.5;     // mg/L NO3-N 去除能力
      no3D = Math.max(0, B.no3 - capF);
      tnD = tnC - (B.no3 - no3D);
      tpD = Math.max(0.05, tpT * 0.95);
      ssD = Math.max(3, ssT * 0.85);
      codD = codT * 0.95;
      addE('反硝化滤池（反冲洗）', 16, 20);
      R.u.dnfilter = { area: area, rate: P.df_rate, ebct: P.df_ebct, naac: P.df_naac, no3In: B.no3, no3Out: no3D, removed: (B.no3 - no3D) * Q / 1000 };
      R.streams.push({ id: 'dnfilter', name: '反硝化滤池', Q: Q, COD: codD, BOD: bodT * 0.9, SS: ssD, NH: nhT, TN: tnD, TP: tpD, ALK: B.alkLeft, hrt: P.df_ebct / 60, note: P.df_naac > 0 ? ('乙酸钠 ' + P.df_naac + ' mg/L') : '不投碳源' });
    }

    /* ---- 滤布滤池 ---- */
    let ssF, codF, tpf, tnf, nhf, bodf;
    {
      const area = Qd / (P.fl_rate * 24);
      ssF = Math.min(ssD, P.fl_ss);
      codF = codD * 0.95;
      bodf = bodT * 0.85;
      tpf = tpD * 0.97;
      tnf = tnD; nhf = nhT;
      addE('滤布滤池', 10, 22);
      R.u.filter = { area: area, rate: P.fl_rate, ssOut: ssF };
      R.streams.push({ id: 'filter', name: '滤布滤池', Q: Q, COD: codF, BOD: bodf, SS: ssF, NH: nhf, TN: tnf, TP: tpf, ALK: B.alkLeft, hrt: 0.2, note: '出水 SS 控制 ' + P.fl_ss });
    }

    /* ---- 消毒 ---- */
    let fc, codE;
    {
      const logRem = clamp(0.8 + 1.15 * P.di_dose * Math.pow(P.di_ct / 30, 0.4), 0, 7);
      fc = 1e7 / Math.pow(10, logRem);
      codE = codF * 0.98;
      addE('加药与消毒', 2.2);
      R.u.disinfection = { logRem: logRem, fc: fc, dose: P.di_dose, ct: P.di_ct };
      R.streams.push({ id: 'out', name: '出水', Q: Q, COD: codE, BOD: bodf, SS: ssF, NH: nhf, TN: tnf, TP: tpf, ALK: B.alkLeft, hrt: 0.5, note: '达标排放' });
      R.effluent = R.streams[R.streams.length - 1];
    }

    /* ---- 污泥处理 ---- */
    const sludge = {};
    {
      const ds = dsPrimary + B.Px + dsChem;
      const thickVol = ds / ((1 - P.sl_thick / 100) * 1000);
      const cake = ds / ((1 - P.sl_cake / 100));           // kg/d 泥饼
      const pamSludge = ds / 1000 * P.sl_pam;
      addE('污泥脱水', 74, 18);
      addE('污泥浓缩', 11, 20);
      sludge.ds = ds;
      sludge.dsPrimary = dsPrimary;
      sludge.dsBio = B.Px;
      sludge.dsChem = dsChem;
      sludge.volIn = dsPrimary / ((1 - P.pc_moist / 100) * 1000) + B.qw;
      sludge.thickVol = thickVol;
      sludge.cake = cake / 1000;        // t/d
      sludge.moist = P.sl_cake;
      sludge.pam = pamSludge;
      sludge.filterQ = Math.max(0, thickVol - cake / 1000);
      R.sludge = sludge;
      R.u.sludge = { ds: ds, thickVol: thickVol, cake: cake / 1000, dsPrimary: dsPrimary, dsBio: B.Px, dsChem: dsChem, pam: pamSludge };
      R.streams.push({ id: 'sludge', name: '污泥脱水（泥饼）', Q: 0, COD: 0, BOD: 0, SS: 0, NH: 0, TN: 0, TP: 0, ALK: 0, hrt: 0, note: '含水率 ' + P.sl_cake + '%' });
    }

    /* ---- 能耗汇总 ---- */
    addE('其他辅助（除臭、照明、自控）', 25);
    R.energyTotal = R.energy.reduce(function (a, e) { return a + e.kwh; }, 0);
    R.energyPerM3 = R.energyTotal / Q;
    R.u.energy = { total: R.energyTotal, perM3: R.energyPerM3 };

    /* ---- 设备清单与负荷校核 ---- */
    (function () {
      var list = [];
      var unitName = {};
      UNITS.forEach(function (u) { unitName[u.id] = u.name; });
      var install = 0, running = 0;
      Object.keys(EQ_SPEC).forEach(function (uid) {
        var u = R.u[uid];
        if (!u) return;
        u.eq = EQ_SPEC[uid].map(function (t) {
          var n = P[t.nk] || 1;
          var ns = t.nsk ? (P[t.nsk] || 0) : 0;
          var p = t.pk ? P[t.pk] : 0;
          var cap = t.cap ? t.cap(P) : 0;
          var dem = t.dem ? t.dem(R, P) : null;
          var load = (dem !== null && cap > 0) ? dem / cap : null;
          var kw = t.kw ? t.kw(R, P) : 0;
          install += p * (n + ns);
          running += kw;
          var item = {
            id: t.id, name: t.name, n: n, ns: ns, p: p, cap: cap, dem: dem, load: load,
            kw: kw, unit: t.unit, fields: t.fields, unitId: uid, unitName: unitName[uid]
          };
          list.push(item);
          return item;
        });
      });
      R.equipment = list;
      R.eqInstall = install;
      R.eqRunning = running;
      list.forEach(function (e) {
        if (e.load === null || !(e.dem > 0)) return;
        var l = Math.round(e.load * 100);
        if (e.load > 1.02) {
          R.warn.push({ lv: 'bad', t: e.unitName + '「' + e.name + '」能力不足：需求 ' + Math.round(e.dem) + ' / 额定 ' + Math.round(e.cap) + ' ' + e.unit + '（负荷率 ' + l + '%），需增加台数或加大规格。' });
        } else if (e.load < 0.4) {
          R.warn.push({ lv: 'warn', t: e.unitName + '「' + e.name + '」选型偏大：负荷率仅 ' + l + '%。' });
        }
      });
    })();

    /* ---- 达标判定 ---- */
    const out = R.effluent;
    const cmp = [];
    function push(name, key, val, dec, unit) {
      const lim = LIMITS.A[key];
      cmp.push({ name: name, value: val, limit: lim, dec: dec, unit: unit, pass: val <= lim, ratio: val / lim });
    }
    push('COD', 'COD', out.COD, 1, 'mg/L');
    push('BOD₅', 'BOD', out.BOD, 1, 'mg/L');
    push('SS', 'SS', out.SS, 1, 'mg/L');
    push('NH₃-N', 'NH', out.NH, 2, 'mg/L');
    push('TN', 'TN', out.TN, 1, 'mg/L');
    push('TP', 'TP', out.TP, 2, 'mg/L');
    push('粪大肠菌群', 'FC', fc, 0, '个/L');
    R.compliance = cmp;
    R.pass = cmp.every(function (c) { return c.pass; });
    R.passCount = cmp.filter(function (c) { return c.pass; }).length;
    R.complianceB = [
      { name: 'COD', key: 'COD' },
      { name: 'BOD₅', key: 'BOD' },
      { name: 'SS', key: 'SS' },
      { name: 'NH₃-N', key: 'NH' },
      { name: 'TN', key: 'TN' },
      { name: 'TP', key: 'TP' }
    ].map(function (x) {
      const v = LIMITS.A[x.key] !== undefined ? (x.key === 'COD' ? out.COD : x.key === 'BOD' ? out.BOD : x.key === 'SS' ? out.SS : x.key === 'NH' ? out.NH : x.key === 'TN' ? out.TN : out.TP) : 0;
      return { name: x.name, value: v, limitA: LIMITS.A[x.key], limitB: LIMITS.B[x.key], passA: v <= LIMITS.A[x.key], pass: v <= LIMITS.B[x.key] };
    });

    /* ---- 成本 ---- */
    const elec = R.energyTotal * P.c_elec / Q;
    const pacCost = P.tp_pac * P.c_pac / 1000;
    const pamCost = (P.tp_pam + P.sl_pam * sludge.ds / 1000 / Q * 1000) * P.c_pam / 1000;
    const naacCost = (P.ax_carbon + P.df_naac) * P.c_naac / 1000;
    const naoclCost = P.di_dose * P.c_naocl / 1000;
    const chem = pacCost + pamCost + naacCost + naoclCost;
    const sludgeCost = sludge.cake * P.c_sludge / Q;
    const totalCost = elec + chem + sludgeCost + P.c_fixed;
    R.cost = {
      elec: elec, chem: chem, pac: pacCost, pam: pamCost, naac: naacCost, naocl: naoclCost,
      sludge: sludgeCost, fixed: P.c_fixed, total: totalCost,
      chemKg: { pac: P.tp_pac, pam: P.tp_pam + P.sl_pam * sludge.ds / 1000 / Q * 1000, naac: P.ax_carbon + P.df_naac, naocl: P.di_dose }
    };

    /* ---- 提示 ---- */
    const W = R.warn;
    if (out.TN > 15) W.push({ lv: 'bad', t: '出水 TN ' + out.TN.toFixed(1) + ' mg/L 超过一级 A 限值 15 mg/L，可提高内回流比、投加碳源或开启反硝化滤池加药。' });
    if (out.TP > 0.5) W.push({ lv: 'bad', t: '出水 TP ' + out.TP.toFixed(2) + ' mg/L 超过 0.5 mg/L，建议提高 PAC 投加量或改善厌氧区环境。' });
    if (out.NH > 5) W.push({ lv: 'bad', t: '出水氨氮 ' + out.NH.toFixed(1) + ' mg/L 超标，硝化不彻底：检查 SRT、DO、水温与碱度。' });
    if (out.COD > 50) W.push({ lv: 'bad', t: '出水 COD 超标，检查进水冲击负荷与生化池停留时间。' });
    if (out.SS > 10) W.push({ lv: 'bad', t: '出水 SS 超标：二沉池表面负荷或固体负荷偏高。' });
    if (B.alkLeft < 50) W.push({ lv: 'warn', t: '剩余碱度仅 ' + B.alkLeft.toFixed(0) + ' mg/L，硝化受到碱度限制。' });
    if (B.fNit < 0.95) W.push({ lv: 'warn', t: '硝化率 ' + (B.fNit * 100).toFixed(0) + '%，SRT 相对最低硝化泥龄偏短（需 ' + B.srtMin.toFixed(1) + ' d）。' });
    if (R.u.clarifier.slr > P.cl_slr) W.push({ lv: 'warn', t: '二沉池固体负荷 ' + R.u.clarifier.slr.toFixed(0) + ' kg/(m²·d) 超过控制值，存在跑泥风险。' });
    if (P.cl_R / 100 * 1 > 1.2) W.push({ lv: 'warn', t: '污泥回流比偏高，回流污泥携带的硝态氮会抑制厌氧释磷。' });
    if (P.ax_r < 150) W.push({ lv: 'warn', t: '内回流比偏低，脱氮潜力受限。' });
    if (P.an_do > 0.5) W.push({ lv: 'warn', t: '厌氧区 DO 偏高，聚磷菌释磷受抑制。' });
    if (B.capC < B.capK) W.push({ lv: 'warn', t: '反硝化受碳源限制，可考虑投加碳源或超越初沉池保留碳源。' });
    if (fc > 1000) W.push({ lv: 'warn', t: '粪大肠菌群超标，消毒 CT 值不足。' });
    if (W.length === 0) W.push({ lv: 'ok', t: '当前工况全部指标达到《城镇污水处理厂污染物排放标准》一级 A 标准。' });

    return R;
  }

  return { UNITS: UNITS, DEFAULTS: DEFAULTS, CATS: CATS, LIMITS: LIMITS, simulate: simulate };
})();
</script>

    PIPES.forEach(function (p) {
      s += '<path class="pipe ' + p.cls + '" d="' + p.d + '" marker-end="url(#' + p.mk + ')"/>';
      s += '<path class="flow ' + p.cls + '" d="' + p.d + '"/>';
    });
    s += '</g>';

    PIPES.forEach(function (p) {
      if (!p.label) return;
      var tr = p.rot ? ' transform="rotate(-90 ' + p.lx + ' ' + p.ly + ')"' : '';
      s += '<text class="plabel" x="' + p.lx + '" y="' + p.ly + '"' + tr + '>' + p.label + '</text>';
    });

    DOSES.forEach(function (d) {
      s += '<g class="dose">';
      s += '<rect x="' + d.x + '" y="' + d.y + '" width="' + d.w + '" height="' + d.h + '" rx="8"/>';
      s += '<text x="' + (d.x + d.w / 2) + '" y="' + (d.y + 22) + '">' + d.label + '</text>';
      s += '</g>';
      s += '<path class="flow c" d="' + d.arrow + '" marker-end="url(#aC)"/>';
    });

    NODES.forEach(function (n) {
      var cx = n.w / 2;
      var titleY = n.pill ? 20 : (n.h > 150 ? 30 : 26);
      var lineY = n.pill ? 37 : (n.h > 150 ? 56 : 50);
      var step = n.h > 150 ? 24 : 20;
      var cls = n.pill ? 'node pill' : 'node';
      s += '<g class="' + cls + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">';
      if (!n.pill) s += '<rect class="card" width="' + n.w + '" height="' + n.h + '" rx="10"/>';
      else s += '<rect class="card" width="' + n.w + '" height="' + n.h + '" rx="' + (n.h / 2) + '"/>';
      if (!n.pill) s += '<rect class="bar" width="' + n.w + '" height="4" rx="2" fill="' + catColor(n.id) + '"/>';
      s += '<text class="nt" x="' + cx + '" y="' + titleY + '">' + n.name + '</text>';
      for (var i = 0; i < n.n; i++) {
        s += '<text class="nl" x="' + cx + '" y="' + (lineY + i * step) + '" data-m="' + n.id + ':' + i + '"></text>';
      }
      if (!n.pill) s += '<circle class="st" cx="' + (n.w - 11) + '" cy="13" r="3.5"/>';
      s += '</g>';
    });
    s += '</svg>';
    $('#diagram').innerHTML = s;
  }

  function updateDiagram() {
    NODES.forEach(function (n) {
      var g = $('.node[data-id="' + n.id + '"]');
      if (!g) return;
      var info = nodeInfo(n.id);
      var texts = $$('text.nl', g);
      for (var i = 0; i < texts.length; i++) texts[i].textContent = info.l[i] || '';
      var st = $('.st', g);
      if (st) st.setAttribute('class', 'st ' + statusOf(n.id));
      g.classList.toggle('sel', n.id === sel);
    });
  }

  /* ------------------------------------------------------------ 参数面板 */
  function unitById(id) {
    for (var i = 0; i < WW.UNITS.length; i++) if (WW.UNITS[i].id === id) return WW.UNITS[i];
    return null;
  }

  function readoutRows(u) {
    var x = R.u, r = [];
    switch (u.id) {
      case 'influent':
        r.push(['设计规模', fmt(P.Qd, 0), 'm³/d']);
        r.push(['实际处理量', fmt(P.Q, 0), 'm³/d']);
        r.push(['负荷率', fmt(P.Q / P.Qd * 100, 0), '%']);
        r.push(['峰值流量', fmt(P.Q * P.Kz, 0), 'm³/d']);
        r.push(['BOD/COD', fmt(P.iBOD / P.iCOD, 2), '']);
        r.push(['TN 负荷', fmt(P.iTN * P.Q / 1000, 0), 'kg/d']);
        break;
      case 'coarse':
        r.push(['实际 SS 去除率', fmt(x.coarse.rs * 100, 1), '%']);
        r.push(['栅渣量', fmt(x.coarse.screenings, 1), 'm³/d']);
        r.push(['水头损失', fmt(P.cs_loss, 2), 'm']);
        r.push(['过栅流速', fmt(P.cs_v, 2), 'm/s']);

      case 'pump':

        r.push(['吨水电耗', fmt(x.pump.perM3, 4), 'kWh/m³']);
        r.push(['单泵流量', fmt(x.pump.single, 0), 'm³/d']);
        break;
      case 'fine':
        r.push(['实际 SS 去除率', fmt(x.fine.rs * 100, 1), '%']);
        r.push(['栅渣量', fmt(x.fine.screenings, 1), 'm³/d']);
        r.push(['水头损失', fmt(P.fs_loss, 2), 'm']);
        break;
      case 'grit':
        r.push(['池容', fmt(x.grit.V, 0), 'm³']);
        r.push(['实际 HRT', fmt(x.grit.hrt, 1), 'min']);
        r.push(['曝气量', fmt(x.grit.air, 0), 'm³/d']);
        r.push(['沉砂量', fmt(x.grit.grit, 1), 'm³/d']);

      case 'primary':

      case 'anoxic':

        r.push(['沉淀面积', fmt(x.tertiary.area, 0), 'm²']);

      case 'filter':
        r.push(['过滤面积', fmt(x.filter.area, 0), 'm²']);
        r.push(['出水 SS', fmt(x.filter.ssOut, 1), 'mg/L']);
        break;
      case 'disinfection':
        r.push(['灭活对数', fmt(x.disinfection.logRem, 1), 'log']);
        r.push(['出水粪大肠菌群', fmt(x.disinfection.fc, 0), '个/L']);
        r.push(['CT 值', fmt(P.di_dose * P.di_ct, 0), 'mg·min/L']);
        break;
      case 'sludge':
        r.push(['总干泥', fmt(x.sludge.ds / 1000, 2), 'tDS/d']);

        r.push(['剩余污泥', fmt(x.sludge.dsBio / 1000, 2), 'tDS/d']);
        r.push(['化学污泥', fmt(x.sludge.dsChem / 1000, 2), 'tDS/d']);
        r.push(['浓缩后体积', fmt(x.sludge.thickVol, 0), 'm³/d']);

      case 'cost':

        r.push(['药剂费', fmt(R.cost.chem, 3), '元/m³']);
        r.push(['污泥处置', fmt(R.cost.sludge, 3), '元/m³']);
        r.push(['固定成本', fmt(R.cost.fixed, 3), '元/m³']);
        r.push(['合计', fmt(R.cost.total, 3), '元/m³']);

    return r;
  }

  function buildPanel() {
    var u = unitById(sel);
    if (!u) return;
    var cat = WW.CATS[u.cat];
    var h = '<div class="ph">';
    h += '<div class="pcat" style="--c:' + cat.color + '">' + cat.name + '</div>';
    h += '<h2>' + u.name + '</h2>';
    h += '<p>' + u.desc + '</p>';
    h += '</div>';

    h += '<div class="reads" id="reads"></div>';
    if (R.u[u.id] && R.u[u.id].eq) h += equipSection(u);
    h += '<div class="params" id="params">';

    var groups = [];
    u.params.forEach(function (p) { if (!p.eq && groups.indexOf(p.g) < 0) groups.push(p.g); });
    groups.forEach(function (g) {
      h += '<div class="pgroup"><div class="pgt">' + g + '</div>';
      u.params.filter(function (p) { return p.g === g; }).forEach(function (p) {
        if (p.type === 'switch') {
          h += '<div class="prow">' +
            '<div class="ptop"><span class="plabel">' + p.label + '</span></div>' +
            '<button class="pbtn" data-sw="' + p.k + '">' + (P[p.k] ? '已开启' : '未开启') + '</button>' +
            (p.hint ? '<div class="phint">' + p.hint + '</div>' : '') +
            '</div>';
        } else {
          var dec = p.dec || 0;
          h += '<div class="prow">' +
            '<div class="ptop"><span class="plabel">' + p.label + '</span><span class="pval" data-v="' + p.k + '">' + fmt(P[p.k], dec) + '</span><span class="punit">' + (p.unit || '') + '</span></div>' +
            '<input class="prange" type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + P[p.k] + '" data-k="' + p.k + '" data-dec="' + dec + '">' +
            (p.hint ? '<div class="phint">' + p.hint + '</div>' : '') +
            '</div>';
        }
      });
      h += '</div>';
    });
    h += '</div>';
    h += '<button class="btn ghost" id="btn-unit-reset">恢复本单元默认值</button>';
    $('#panel').innerHTML = h;
    $('#panel').scrollTop = 0;
    updateReadouts();
  }

  /* ---- 配套设备卡片 ---- */
  function equipQty(e) {
    return e.p > 0 ? (e.n + ' 用' + (e.ns ? ' ' + e.ns + ' 备' : '')) : (fmt(e.n, 0) + ' ' + e.unit);
  }

  function equipCard(u, e) {
    var fields = e.fields.map(function (k) {
      var p = u.params.filter(function (x) { return x.k === k; })[0];
      if (!p) return '';
      return '<label class="eqf"><span>' + p.label + '</span><input type="number" data-k="' + k +
        '" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + P[k] + '"><i>' + (p.unit || '') + '</i></label>';
    }).join('');
    var h = '<div class="eqcard">';
    h += '<div class="eqh"><span class="eqn">' + e.name + '</span><span class="eqc" data-eq-qty="' + e.id + '">' + equipQty(e) + '</span></div>';
    if (e.load !== null) {
      h += '<div class="eqline"><span>额定 <b data-eq-cap="' + e.id + '">' + fmtInt(e.cap) + '</b> ' + e.unit + '</span>' +
        '<span>需求 <b data-eq-dem="' + e.id + '">' + fmtInt(e.dem) + '</b> ' + e.unit + '</span></div>';
      h += '<div class="eqbar"><i data-eq-bar="' + e.id + '" style="width:' + Math.min(100, Math.max(2, e.load * 100)) + '%"></i></div>';
    }
    h += '<div class="eqfoot"><span data-eq-load="' + e.id + '">' +
      (e.load === null ? '固定工况' : '负荷率 ' + fmt(e.load * 100, 0) + '%') +
      '</span><span data-eq-kw="' + e.id + '">' + (e.kw > 0 ? '运行 ' + fmt(e.kw, 0) + ' kW' : '—') + '</span></div>';
    h += '<div class="eqfields">' + fields + '</div>';
    h += '<div class="eqlook" data-model="' + e.id + '">查看设备模型 →</div>';
    h += '</div>';
    return h;
  }

  function equipSection(u) {
    var items = R.u[u.id].eq;
    var h = '<div class="eqsec"><div class="pgt">配套设备（选型 · 负荷率）</div>';
    items.forEach(function (e) { h += equipCard(u, e); });
    h += '</div>';
    return h;
  }

  function updateEquipment() {
    var u = unitById(sel);
    if (!u || !R.u[u.id] || !R.u[u.id].eq) return;
    R.u[u.id].eq.forEach(function (e) {
      var q = $('[data-eq-qty="' + e.id + '"]');
      if (q) q.textContent = equipQty(e);
      var cap = $('[data-eq-cap="' + e.id + '"]');
      if (cap) cap.textContent = fmtInt(e.cap);
      var dem = $('[data-eq-dem="' + e.id + '"]');
      if (dem) dem.textContent = fmtInt(e.dem);
      var bar = $('[data-eq-bar="' + e.id + '"]');
      if (bar) {
        bar.style.width = Math.min(100, Math.max(2, e.load * 100)) + '%';
        bar.className = e.load > 1.02 ? 'r-bad' : e.load > 0.99 ? 'r-warn' : 'r-ok';
      }
      var ld = $('[data-eq-load="' + e.id + '"]');
      if (ld) ld.textContent = '负荷率 ' + fmt(e.load * 100, 0) + '%';
      var kw = $('[data-eq-kw="' + e.id + '"]');
      if (kw) kw.textContent = e.kw > 0 ? '运行 ' + fmt(e.kw, 0) + ' kW' : '—';
    });
  }

  function updateReadouts() {
    var u = unitById(sel);
    if (!u) return;
    var rows = readoutRows(u);
    var h = '<div class="rt">计算值</div><div class="rgrid">';
    rows.forEach(function (r) {
      h += '<div class="rcell"><div class="rk">' + r[0] + '</div><div class="rv">' + r[1] + '<span>' + r[2] + '</span></div></div>';
    });
    h += '</div>';
    $('#reads').innerHTML = h;
  }

  /* ------------------------------------------------------------ KPI */
  var KPI_DEF = [
    { k: 'q', t: '处理量', u: '万 m³/d' },
    { k: 'cod', t: '出水 COD', u: 'mg/L' },
    { k: 'nh', t: '出水 NH₃-N', u: 'mg/L' },
    { k: 'tn', t: '出水 TN', u: 'mg/L' },
    { k: 'tp', t: '出水 TP', u: 'mg/L' },
    { k: 'pass', t: '一级 A 达标', u: '' },
    { k: 'energy', t: '吨水电耗', u: 'kWh/m³' },
    { k: 'cost', t: '吨水成本', u: '元/m³' }
  ];

  function buildKPI() {
    var h = '';
    KPI_DEF.forEach(function (d) {
      h += '<div class="kpi' + (d.k === 'pass' ? ' kpass' : '') + '" id="kpi-' + d.k + '">' +
        '<div class="kt">' + d.t + '</div>' +
        '<div class="kv"><b>—</b><span>' + d.u + '</span></div>' +
        '<div class="kbar"><i></i></div>' +
        '</div>';
    });
    $('#kpis').innerHTML = h;
  }

  function updateKPI() {
    var e = R.effluent;
    var set = function (k, v, unit) {
      var el = $('#kpi-' + k + ' b');
      if (el) el.textContent = v;
    };
    set('q', fmt(P.Q / 10000, 1));
    set('cod', fmt(e.COD, 1));
    set('nh', fmt(e.NH, 2));
    set('tn', fmt(e.TN, 1));
    set('tp', fmt(e.TP, 2));
    set('energy', fmt(R.energyPerM3, 3));
    set('cost', fmt(R.cost.total, 2));

    var p = $('#kpi-pass');
    p.classList.toggle('ok', R.pass);
    p.classList.toggle('bad', !R.pass);
    p.querySelector('b').textContent = R.pass ? '达标 ' + R.passCount + '/7' : '超标 ' + (7 - R.passCount) + ' 项';
    p.querySelector('span').textContent = '';

    var bar = function (k, ratio) {
      var el = $('#kpi-' + k + ' .kbar i');
      if (!el) return;
      el.style.width = Math.min(100, Math.max(3, ratio * 100)) + '%';
      el.className = ratio > 1 ? 'r-bad' : ratio > 0.75 ? 'r-warn' : 'r-ok';
    };
    bar('cod', e.COD / 50);
    bar('nh', e.NH / 5);
    bar('tn', e.TN / 15);
    bar('tp', e.TP / 0.5);
    bar('energy', R.energyPerM3 / 0.45);
    bar('cost', R.cost.total / 1.2);
    (function () {
      var el = $('#kpi-q .kbar i');
      if (!el) return;
      var r = P.Q / P.Qd;
      el.style.width = Math.min(100, r * 100) + '%';
      el.className = r > 1 ? 'r-bad' : 'r-ok';
    })();
  }

  function updateAlerts() {
    var bad = R.warn.filter(function (w) { return w.lv === 'bad'; });
    var warn = R.warn.filter(function (w) { return w.lv === 'warn'; });
    var h = '';
    bad.slice(0, 2).forEach(function (w) { h += '<div class="alert bad">' + esc(w.t) + '</div>'; });
    warn.slice(0, 2).forEach(function (w) { h += '<div class="alert warn">' + esc(w.t) + '</div>'; });
    if (!h) h = '<div class="alert ok">' + esc(R.warn[0] ? R.warn[0].t : '运行正常') + '</div>';
    $('#alerts').innerHTML = h;
  }

  /* ------------------------------------------------------------ 底部页签 */
  function renderTab() {
    var body = $('#tabbody');
    if (tab === 'table') body.innerHTML = viewTable();
    else if (tab === 'compliance') body.innerHTML = viewCompliance();
    else if (tab === 'energy') body.innerHTML = viewEnergy();
    else if (tab === 'cost') body.innerHTML = viewCost();
    else if (tab === 'models') body.innerHTML = viewModels();
    else body.innerHTML = viewNotes();
  }

  function streamRows() {
    return R.streams.filter(function (s) { return s.id !== 'sludge'; });
  }

  function viewTable() {
    var rows = streamRows();
    var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>处理单元</th><th>停留时间</th><th>流量 m³/d</th><th>COD</th><th>BOD₅</th><th>SS</th><th>NH₃-N</th><th>TN</th><th>TP</th><th>碱度</th><th>COD 去除率</th>' +
      '</tr></thead><tbody>';
    var c0 = rows[0].COD;
    rows.forEach(function (s) {
      var rem = c0 > 0 ? (1 - s.COD / c0) * 100 : 0;
      h += '<tr' + (s.id === 'out' ? ' class="rowout"' : '') + '>' +
        '<td class="name">' + esc(s.name) + '</td>' +
        '<td>' + (s.hrt ? fmt(s.hrt, 2) + ' h' : '—') + '</td>' +
        '<td>' + (s.Q ? fmt(s.Q, 0) : '—') + '</td>' +
        '<td>' + fmt(s.COD, 1) + '</td>' +
        '<td>' + fmt(s.BOD, 1) + '</td>' +
        '<td>' + (s.SS > 1000 ? fmt(s.SS, 0) : fmt(s.SS, 1)) + '</td>' +
        '<td>' + fmt(s.NH, 2) + '</td>' +
        '<td>' + fmt(s.TN, 1) + '</td>' +
        '<td>' + fmt(s.TP, 2) + '</td>' +
        '<td>' + fmt(s.ALK, 0) + '</td>' +
        '<td>' + fmt(rem, 1) + '%</td>' +
        '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="chartbox"><div class="ct">沿程浓度（占进水百分比）</div>' + chart() + '</div>';
    h += '<div class="note-line">峰值流量（Kz=' + P.Kz + '）下各构筑物负荷按 ' + fmt(P.Q * P.Kz, 0) + ' m³/d 校核；表中浓度除生化池为混合液外，其余均为该单元出水。</div>';
    return h;
  }

  function chart() {
    var rows = streamRows();
    var W = 720, H = 238, padL = 38, padR = 10, padT = 26, padB = 66;
    var series = [
      { key: 'COD', color: '#0ea5e9', name: 'COD' },
      { key: 'TN', color: '#f59e0b', name: 'TN' },
      { key: 'NH', color: '#10b981', name: 'NH₃-N' },
      { key: 'TP', color: '#a855f7', name: 'TP' }
    ];
    var base = rows[0];
    var n = rows.length;
    var xs = function (i) { return padL + (W - padL - padR) * (i / (n - 1)); };
    var ys = function (v) { return padT + (H - padT - padB) * (1 - v); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
    [0, 25, 50, 75, 100].forEach(function (g) {
      s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + ys(g / 100) + '" y2="' + ys(g / 100) + '" class="cgrid"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (ys(g / 100) + 3) + '" class="clab" text-anchor="end">' + g + '%</text>';
    });
    series.forEach(function (se) {
      var pts = rows.map(function (r, i) {
        var v = base[se.key] > 0 ? Math.min(1.15, r[se.key] / base[se.key]) : 0;
        return xs(i) + ',' + ys(v);
      }).join(' ');
      s += '<polyline points="' + pts + '" fill="none" stroke="' + se.color + '" stroke-width="2.2" stroke-linejoin="round"/>';
      rows.forEach(function (r, i) {
        var v = base[se.key] > 0 ? Math.min(1.15, r[se.key] / base[se.key]) : 0;
        s += '<circle cx="' + xs(i) + '" cy="' + ys(v) + '" r="2.4" fill="' + se.color + '"/>';
      });
    });
    rows.forEach(function (r, i) {
      if (i % 2 === 0 || r.id === 'out') {
        s += '<text x="' + xs(i) + '" y="' + (H - 30) + '" class="cxlab" text-anchor="end" transform="rotate(-32 ' + xs(i) + ' ' + (H - 30) + ')">' + esc(r.name.replace('（泥饼）', '')) + '</text>';
      }
    });
    s += '</svg>';
    var lg = '<div class="clegend">';
    series.forEach(function (se) {
      lg += '<span><i style="background:' + se.color + '"></i>' + se.name + '</span>';
    });
    lg += '</div>';
    return lg + s;
  }

  function viewNotes() {
    return '<div class="notes">' +
      '<h3>模型定位</h3>' +
      '<p>这是一个<b>工程级工艺模拟器</b>：进水、各处理单元、回流与污泥线按物料平衡串联，生化段采用简化活性污泥动力学。目标是让参数变化的方向、量级与真实污水厂一致，用于方案比选、运行诊断与教学演示，<b>不替代</b>设计院的精确计算或 ASM 商业软件。</p>' +
      '<h3>核心计算关系</h3>' +
      '<ul>' +
      '<li><b>池容</b>：由「设计规模 × 设计 HRT」确定；改变实际处理量只改变负荷，不改变池容，因此超负荷会真实反映在停留时间与固体负荷上。</li>' +
      '<li><b>MLSS</b>：MLSS = SRT × 剩余污泥量 ÷ 生化池容积，随 SRT、进水负荷与初沉效果联动。</li>' +
      '<li><b>硝化</b>：由硝化菌比增长速率（温度 θ=1.072、DO 半饱和 0.5 mg/L、氨氮半饱和 1 mg/L）反算最低泥龄 SRTmin，实际 SRT/SRTmin 决定硝化完成度；碱度不足时自动限制硝化。</li>' +
      '<li><b>反硝化</b>：取「碳源限制能力」与「动力学能力（SDNR × MLSS × 缺氧池容积）」的较小值，同时受内回流比决定的理论下限约束；温度按 θ=1.06 修正。</li>' +
      '<li><b>除磷</b>：厌氧释磷量随进水 TP、HRT 与厌氧区 DO 变化；回流污泥带入的硝态氮会抑制释磷；好氧段按 2.6 倍释磷量吸磷，剩余 TP 由 PAC 化学沉淀兜底。</li>' +
      '<li><b>需氧量</b>：AOR = 0.5×去除 COD + 4.57×硝化量 − 2.86×反硝化量；再按 α、β、水深、温度折算为标准氧 SOR，由氧转移效率反算风量与鼓风机功率。</li>' +
      '<li><b>二沉池</b>：出水 SS 由实际表面负荷的立方项与固体负荷超限共同决定。</li>' +
      '</ul>' +
      '<h3>主要假设</h3>' +
      '<ul>' +
      '<li>进水不含硝态氮，有机氮按 TN−NH₃-N 计；同化需氮按 0.045 kgN/kgDS 扣除。</li>' +
      '<li>滤液回流按进水量比例带入 NH₃-N 150、COD 250、TP 20 mg/L 的负荷。</li>' +
      '<li>电耗为单元估算值（泵扬程、风机风压、搅拌功率密度），不含厂区照明等极小事項。</li>' +
      '<li>化学污泥按 PAC 投加量的 0.35 倍干泥估算；泥饼按设定含水率折算。</li>' +
      '</ul>' +
      '<h3>设备模型（教学用）</h3>' +
      '<p>「设备模型」页签里是 23 台设备的剖面示意图，分 13 类结构。点开任意一台可以看到：带编号的部件（与图上 ①②③ 一一对应）、它在厂里做什么、工作原理、常见故障，以及它在<b>当前工况</b>下的台数、负荷率、额定与需求、运行功率。图形会随参数联动：把水量从 10 万调到 13 万，泵和风机的负荷率会跟着涨，卡片变红就是“这台机器选小了”。</p>' +
      '<p>图是示意剖面，不是施工图；尺寸比例经过简化，目的是让学生看懂“这个东西长什么样、水从哪进从哪出、为什么会坏”。</p>' +
      '<h3>使用建议</h3>' +
      '<p>先看「出水达标」判断短板，再回到流程图点击对应单元调参：TN 不够优先看内回流比、碳源、缺氧池 HRT 与水温；TP 不够优先看 PAC 与厌氧区 DO；SS 不够看二沉池表面负荷与 PAC；氨氮不够看 SRT、DO 与碱度。每改一次参数，右上角 KPI 与流程图状态点会同步变化。</p>' +
      '</div>';
  }

  /* ------------------------------------------------------------ 刷新 */
  var raf = null;
  function refresh(rebuildPanel) {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      R = WW.simulate(P);
      updateKPI();
      updateDiagram();
      updateAlerts();
      if (rebuildPanel) buildPanel(); else { updateReadouts(); updateEquipment(); }
      renderTab();
      if (tab === 'cost') buildPriceEdit();
    });
  }

  /* ------------------------------------------------------------ 交互 */
  function bind() {
    $('#diagram').addEventListener('click', function (ev) {
      var g = ev.target.closest('.node');
      if (!g) return;
      sel = g.getAttribute('data-id');
      buildPanel();
      updateDiagram();
      if (window.innerWidth < 1100) $('#panel').scrollIntoView({ behavior: 'smooth' });
    });

    $('#panel').addEventListener('input', function (ev) {
      var t = ev.target;
      var k = t.getAttribute('data-k');
      if (!k) return;
      var v = parseFloat(t.value);
      if (!isFinite(v)) return;
      P[k] = v;
      if (scenario !== 'custom') { scenario = 'custom'; $('#scenario').value = 'custom'; }
      var pv = $('[data-v="' + k + '"]');
      if (pv) pv.textContent = fmt(v, parseInt(t.getAttribute('data-dec') || '0', 10));
      var range = $('.prange[data-k="' + k + '"]');
      if (range && range !== t) range.value = v;
      refresh(false);
    });

    $('#panel').addEventListener('click', function (ev) {
      var ml = ev.target.closest('[data-model]');
      if (ml) { openModel(ml.getAttribute('data-model')); return; }
      var sw = ev.target.closest('[data-sw]');
      if (sw) {
        var k = sw.getAttribute('data-sw');
        P[k] = P[k] ? 0 : 1;
        if (scenario !== 'custom') { scenario = 'custom'; $('#scenario').value = 'custom'; }
        sw.textContent = P[k] ? '已开启' : '未开启';
        sw.classList.toggle('on', !!P[k]);
        refresh(false);
        return;
      }
      if (ev.target.id === 'btn-unit-reset') {
        var u = unitById(sel);
        u.params.forEach(function (p) { P[p.k] = p.def; });
        buildPanel();
        refresh(false);
      }
    });

    $('#tabbody').addEventListener('click', function (ev) {
      var ml = ev.target.closest('[data-model]');
      if (ml) { openModel(ml.getAttribute('data-model')); }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeModel();
    });

    $('#tabs').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-tab]');
      if (!b) return;

  var CRC_T = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(files) {
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0, cdSize = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name);
      var crc = crc32(f.data);
      var lh = new Uint8Array(30 + name.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0x5021, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, f.data.length, true);
      dv.setUint32(22, f.data.length, true);
      dv.setUint16(26, name.length, true);
      dv.setUint16(28, 0, true);
      lh.set(name, 30);
      parts.push(lh, f.data);

      var cd = new Uint8Array(46 + name.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x5021, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, f.data.length, true);
      cv.setUint32(24, f.data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      cd.set(name, 46);
      central.push(cd);
      cdSize += cd.length;
      offset += lh.length + f.data.length;
    });
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eocd]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function colName(i) {
    var s = '';
    i = i + 1;
    while (i > 0) {
      var m = (i - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  }
  function xesc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function sheetXML(rows, widths) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if (widths) {
      x += '<cols>';
      widths.forEach(function (w, i) { x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; });
      x += '</cols>';
    }
    x += '<sheetData>';
    rows.forEach(function (row, ri) {
      x += '<row r="' + (ri + 1) + '">';
      (row || []).forEach(function (cell, ci) {
        if (cell === null || cell === undefined || cell === '') return;
        var ref = colName(ci) + (ri + 1);
        var style = ri === 0 ? ' s="1"' : '';
        if (typeof cell === 'number' && isFinite(cell)) x += '<c r="' + ref + '"' + style + '><v>' + cell + '</v></c>';
        else x += '<c r="' + ref + '" t="inlineStr"' + style + '><is><t xml:space="preserve">' + xesc(cell) + '</t></is></c>';
      });
      x += '</row>';
    });
    x += '</sheetData></worksheet>';
    return x;
  }

      }).join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');

    put('xl/styles.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="微软雅黑"/></font><font><b/><sz val="11"/><name val="微软雅黑"/></font></fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>');

    sheets.forEach(function (s, i) {
      put('xl/worksheets/sheet' + (i + 1) + '.xml', sheetXML(s.rows, s.widths));
    });

    download(zipStore(files), '污水处理模拟结果.xlsx');
  }
